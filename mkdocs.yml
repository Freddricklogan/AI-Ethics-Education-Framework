site_name: AI Ethics in Education Framework
site_description: Ethical principles, bias assessment, responsible deployment, AI-literacy curriculum and an impact-assessment template for AI in education, with a risk worksheet.
site_url: https://freddricklogan.github.io/AI-Ethics-Education-Framework/
copyright: Freddrick Logan
strict: true
theme:
  name: material
  features: [navigation.sections, navigation.top, search.highlight, content.code.copy]
  palette:   # follows the OS colour scheme, like the Executive Shell's palettes
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey   # Material's teal header cannot reach AA with white labels
      accent: amber
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: amber
nav:
  - Overview: index.md
  - Framework:
      - Ethical principles: ethical-principles.md
      - Bias assessment framework: bias-assessment-framework.md
      - Responsible AI deployment: responsible-ai-deployment.md
      - AI literacy curriculum: ai-literacy-curriculum.md
      - AI impact assessment template: ai-impact-assessment.md
  - Tools:
      - Risk worksheet: tools/risk-worksheet.md
  - Case study: CASE_STUDY.md
extra_css:
  - assets/shell/exec-shell.css
  - assets/shell/tool.css
extra_javascript:
  - path: assets/site.js
    type: module
  - path: assets/risk-page.js
    type: module
markdown_extensions:
  - toc:
      permalink: true
  - admonition
